
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway Runner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  user-select: none;
}

h1 {
  color: #ffd43b;
  margin: 12px 0;
  font-size: 25px;
}

#info {
  display: flex;
  justify-content: space-around;
  max-width: 400px;
  margin: 10px auto;
  font-size: 18px;
}

#game {
  display: block;
  width: min(96vw, 400px);
  height: auto;
  margin: auto;
  border: 3px solid #ffd43b;
  border-radius: 12px;
  background: #222;
  touch-action: none;
}

#controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 12px auto;
}

button {
  background: #ffca28;
  color: #151515;
  border: none;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#restart {
  font-size: 17px;
}

p {
  color: #ccd6e5;
  font-size: 13px;
  padding: 0 10px;
}
</style>
</head>

<body>

<h1>🚆 SUBWAY RUNNER</h1>

<div id="info">
  <span>Счёт: <b id="score">0</b></span>
  <span>🪙 <b id="coins">0</b></span>
  <span>⚡ <b id="level">1</b></span>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div id="controls">
  <button id="left">⬅️</button>
  <button id="jump">⬆️</button>
  <button id="slide">⬇️</button>
  <button id="right">➡️</button>
</div>

<button id="restart">🔄 Начать заново</button>

<p>Свайпай по экрану или используй стрелки клавиатуры.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const levelText = document.getElementById("level");

const W = 400;
const H = 600;
const lanes = [90, 200, 310];

let player;
let obstacles;
let coins;
let particles;
let score;
let collected;
let speed;
let spawnTimer;
let coinTimer;
let roadOffset;
let running;
let started;
let lastTime;
let animationId = 0;

function reset() {
  cancelAnimationFrame(animationId);

  player = {
    lane: 1,
    x: lanes[1],
    jump: 0,
    slide: 0
  };

  obstacles = [];
  coins = [];
  particles = [];

  score = 0;
  collected = 0;
  speed = 260;
  spawnTimer = 0.8;
  coinTimer = 0.5;
  roadOffset = 0;
  running = true;
  started = true;
  lastTime = 0;

  scoreText.textContent = "0";
  coinsText.textContent = "0";
  levelText.textContent = "1";

  animationId = requestAnimationFrame(loop);
}

function move(direction) {
  if (!running) {
    if (direction === "jump") reset();
    return;
  }

  if (direction === "left") {
    player.lane = Math.max(0, player.lane - 1);
  }

  if (direction === "right") {
    player.lane = Math.min(2, player.lane + 1);
  }

  if (direction === "jump" &&
      player.jump === 0 && player.slide <= 0) {
    player.jump = 1;
  }

  if (direction === "slide" &&
      player.slide <= 0 && player.jump === 0) {
    player.slide = 0.65;
  }
}

document.getElementById("left").onclick =
  () => move("left");

document.getElementById("right").onclick =
  () => move("right");

document.getElementById("jump").onclick =
  () => move("jump");

document.getElementById("slide").onclick =
  () => move("slide");

document.getElementById("restart").onclick = reset;

document.addEventListener("keydown", e => {
  if ([
    "ArrowLeft", "ArrowRight",
    "ArrowUp", "ArrowDown", " "
  ].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowLeft" || e.key === "a")
    move("left");

  if (e.key === "ArrowRight" || e.key === "d")
    move("right");

  if (e.key === "ArrowUp" || e.key === " ")
    move("jump");

  if (e.key === "ArrowDown" || e.key === "s")
    move("slide");

  if (e.key === "Enter" && !running)
    reset();
});

let touchX = 0;
let touchY = 0;

canvas.addEventListener("pointerdown", e => {
  touchX = e.clientX;
  touchY = e.clientY;
});

canvas.addEventListener("pointerup", e => {
  if (!running) {
    reset();
    return;
  }

  const dx = e.clientX - touchX;
  const dy = e.clientY - touchY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25)
    return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx < 0 ? "left" : "right");
  } else {
    move(dy < 0 ? "jump" : "slide");
  }
});

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#42b9ed");
  sky.addColorStop(0.42, "#b8e7f5");
  sky.addColorStop(0.43, "#555b65");
  sky.addColorStop(1, "#242832");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Здания
  for (let i = 0; i < 8; i++) {
    const x = i * 55 - 15;
    const bh = 70 + (i % 4) * 25;

    ctx.fillStyle = i % 2 ? "#35445b" : "#45566c";
    ctx.fillRect(x, 190 - bh, 43, bh);

    ctx.fillStyle = "#ffe082";

    for (let wy = 200 - bh; wy < 185; wy += 22) {
      for (let wx = x + 8; wx < x + 38; wx += 17) {
        ctx.fillRect(wx, wy, 7, 10);
      }
    }
  }

  // Дорога
  ctx.fillStyle = "#343a46";
  ctx.beginPath();
  ctx.moveTo(40, 190);
  ctx.lineTo(360, 190);
  ctx.lineTo(400, 600);
  ctx.lineTo(0, 600);
  ctx.closePath();
  ctx.fill();

  // Рельсы и разделители
  ctx.strokeStyle = "#aab2c0";
  ctx.lineWidth = 4;

  for (let i = 0; i < 4; i++) {
    const xTop = 40 + i * (320 / 3);
    const xBottom = i * (400 / 3);

    ctx.beginPath();
    ctx.moveTo(xTop, 190);
    ctx.lineTo(xBottom, 600);
    ctx.stroke();
  }

  // Шпалы
  ctx.fillStyle = "#858b98";

  for (let y = 200 + (roadOffset % 45); y < 600; y += 45) {
    const t = (y - 190) / 410;
    const left = 40 * (1 - t);
    const right = 360 + 40 * t;

    ctx.fillRect(left, y, right - left, 4 + t * 5);
  }
}

function drawPlayer() {
  const x = player.x;
  const jumpHeight = player.jump > 0
    ? Math.sin(player.jump * Math.PI) * 100
    : 0;

  const y = 480 - jumpHeight;
  const sliding = player.slide > 0;

  // Тень
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(x, 500, sliding ? 38 : 25, 9, 0, 0,
    Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);

  if (sliding) {
    ctx.fillStyle = "#252a38";
    ctx.fillRect(-28, -5, 56, 18);

    ctx.fillStyle = "#ff7043";
    ctx.fillRect(-25, -24, 38, 20);

    ctx.fillStyle = "#ffcc99";
    ctx.beginPath();
    ctx.arc(17, -17, 12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Ноги
    ctx.fillStyle = "#202938";
    ctx.fillRect(-18, 5, 14, 32);
    ctx.fillRect(5, 5, 14, 32);

    // Обувь
    ctx.fillStyle = "#f5f5f5";
    ctx.fillRect(-21, 32, 19, 8);
    ctx.fillRect(3, 32, 19, 8);

    // Тело
    ctx.fillStyle = "#ff7043";
    ctx.fillRect(-21, -39, 42, 48);

    // Руки
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(-29, -34, 9, 30);
    ctx.fillRect(20, -34, 9, 30);

    // Голова
    ctx.fillStyle = "#ffcc99";
    ctx.beginPath();
    ctx.arc(0, -52, 18, 0, Math.PI * 2);
    ctx.fill();

    // Волосы
    ctx.fillStyle = "#38251d";
    ctx.beginPath();
    ctx.arc(0, -59, 18, Math.PI, Math.PI * 2);
    ctx.fillRect(-17, -60, 34, 7);

    // Глаза
    ctx.fillStyle = "#222";
    ctx.fillRect(-7, -54, 4, 4);
    ctx.fillRect(5, -54, 4, 4);
  }

  ctx.restore();
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const type = Math.random();

  obstacles.push({
    lane,
    y: -50,
    type: type < 0.45 ? "block" :
          type < 0.75 ? "barrier" : "overhead",
    passed: false
  });
}

function spawnCoins() {
  const lane = Math.floor(Math.random() * 3);

  for (let i = 0; i < 4; i++) {
    coins.push({
      lane,
      y: -i * 42 - 20,
      taken: false
    });
  }
}

function drawObstacle(o) {
  const x = lanes[o.lane];
  const y = o.y;
  const scale = 0.65 + y / 1000;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  if (o.type === "block") {
    ctx.fillStyle = "#e53935";
    ctx.fillRect(-32, -35, 64, 70);

    ctx.fillStyle = "#ffb300";
    ctx.fillRect(-32, -12, 64, 13);

    ctx.fillStyle = "#fafafa";
    ctx.fillRect(-22, -29, 10, 10);
    ctx.fillRect(12, -29, 10, 10);
  }

  if (o.type === "barrier") {
    ctx.fillStyle = "#252b38";
    ctx.fillRect(-33, -20, 66, 55);

    ctx.fillStyle = "#ffca28";
    ctx.fillRect(-33, -20, 66, 12);

    ctx.fillStyle = "#e53935";
    ctx.fillRect(-25, -8, 13, 43);
    ctx.fillRect(12, -8, 13, 43);
  }

  if (o.type === "overhead") {
    ctx.fillStyle = "#8e44ad";
    ctx.fillRect(-36, -38, 72, 22);

    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(-36, -16, 10, 40);
    ctx.fillRect(26, -16, 10, 40);
  }

  ctx.restore();
}

function drawCoin(c) {
  const x = lanes[c.lane];

  ctx.fillStyle = "#ffb300";
  ctx.beginPath();
  ctx.arc(x, c.y, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#fff176";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, c.y, 8, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("$", x, c.y + 5);
}

function gameOver() {
  running = false;

  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffca28";
  ctx.font = "bold 34px Arial";
  ctx.fillText("ИГРА ОКОНЧЕНА", W / 2, 245);

  ctx.fillStyle = "#fff";
  ctx.font = "22px Arial";
  ctx.fillText("Счёт: " + Math.floor(score), W / 2, 295);
  ctx.fillText("Монеты: " + collected, W / 2, 330);

  ctx.font = "17px Arial";
  ctx.fillText("Нажми «Начать заново»", W / 2, 380);
}

function update(dt) {
  speed = Math.min(620, speed + dt * 5);
  score += dt * 10;

  scoreText.textContent = Math.floor(score);
  levelText.textContent = 1 + Math.floor(score / 250);

  roadOffset += speed * dt;

  // Плавное движение между полосами
  player.x += (lanes[player.lane] - player.x) *
    Math.min(1, dt * 12);

  // Прыжок
  if (player.jump > 0) {
    player.jump += dt * 2.5;
    if (player.jump >= 1) player.jump = 0;
  }

  // Подкат
  if (player.slide > 0) {
    player.slide -= dt;
    if (player.slide < 0) player.slide = 0;
  }

  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = Math.max(0.55, 1.25 - score / 2500)
      + Math.random() * 0.45;
  }

  coinTimer -= dt;

  if (coinTimer <= 0) {
    spawnCoins();
    coinTimer = 1.5 + Math.random() * 1.2;
  }

  for (const o of obstacles) {
    o.y += speed * dt;

    if (o.y > 435 && o.y < 520 &&
        o.lane === player.lane) {

      const jumping = player.jump > 0;
      const sliding = player.slide > 0;

      let hit = false;

      if (o.type === "block") {
        hit = !jumping;
      } else if (o.type === "barrier") {
        hit = !jumping;
      } else if (o.type === "overhead") {
        hit = !sliding && !jumping;
      }

      if (hit) {
        gameOver();
        return;
      }
    }
  }

  obstacles = obstacles.filter(o => o.y < 660);

  for (const c of coins) {
    c.y += speed * dt;

    if (!c.taken && c.y > 440 && c.y < 510 &&
        c.lane === player.lane) {
      c.taken = true;
      collected++;
      coinsText.textContent = collected;
      score += 25;
    }
  }

  coins = coins.filter(c => c.y < 650 && !c.taken);
}

function draw() {
  drawBackground();

  for (const c of coins) drawCoin(c);
  for (const o of obstacles) drawObstacle(o);

  drawPlayer();

  if (!started) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffca28";
    ctx.font = "bold 32px Arial";
    ctx.fillText("SUBWAY RUNNER", W / 2, 250);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Нажми ⬆️ чтобы начать", W / 2, 300);
  }
}

function loop(time) {
  if (!running) return;

  if (!lastTime) lastTime = time;

  const dt = Math.min((time - lastTime) / 1000, 0.04);
  lastTime = time;

  update(dt);
  draw();

  if (running) {
    animationId = requestAnimationFrame(loop);
  } else {
    draw();
    gameOver();
  }
}

reset();
</script>

</body>
  </html>
