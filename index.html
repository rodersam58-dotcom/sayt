<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — rodersam58</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>rodersam58</h1>
    <p>Поиск информации с помощью Google Gemini</p>
  </header>

  <main>
    <h2>Что хочешь узнать?</h2>

    <form id="gemini-search">
      <input
        id="car-search"
        type="text"
        placeholder="Например, BMW M5"
        required
      >

      <button type="submit">Найти</button>
    </form>

    <div id="result">
      Здесь появится твой запрос.
    </div>
  </main>

  <script>
    document
      .getElementById("gemini-search")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const query = document
          .getElementById("car-search")
          .value.trim();

        if (!query) return;

        const prompt =
          "Расскажи подробно о " + query +
          ": характеристики, мощность, скорость и цена.";

        document.getElementById("result").textContent =
          "Твой запрос: " + prompt +
          "\n\nОткрой Google Gemini и вставь этот текст.";

        try {
          await navigator.clipboard.writeText(prompt);
        } catch (error) {
          // Если копирование недоступно, запрос всё равно виден на странице.
        }

        window.open(
          "https://gemini.google.com/app",
          "_blank"
        );
      });
  </script>
</body>
</html>
