<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>rodersam58 - мой сайт</title>
<meta name="description" content="Официальный сайт rodersam58">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    color: #222;
}

header {
    background: #222;
    color: white;
    padding: 30px 15px;
}

h1 {
    margin: 0 0 20px;
    font-size: 30px;
}

.search {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    width: 60%;
    max-width: 500px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    padding: 14px 20px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    filter: brightness(1.15);
}

.search-button {
    background: #1877f2;
    color: white;
}

.all-button {
    margin-top: 15px;
    background: #444;
    color: white;
}

#results {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.result {
    background: white;
    margin: 20px 0;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.result h2 {
    margin-top: 0;
    font-size: 24px;
}

.result p {
    color: #555;
}

.result img,
.result video {
    max-width: 100%;
    width: 600px;
    border-radius: 10px;
    margin-top: 10px;
}

.result video {
    background: black;
}

.not-found {
    background: white;
    padding: 30px;
    border-radius: 10px;
}

@media (max-width: 600px) {

    h1 {
        font-size: 25px;
    }

    input {
        width: 100%;
    }

    button {
        width: 100%;
    }

    .result {
        padding: 15px;
    }

    .result h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>

    <h1>rodersam58 - мой сайт</h1>

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Введите название..."
        >

        <button class="search-button" onclick="searchMedia()">
            Поиск
        </button>

    </div>

    <button class="all-button" onclick="showAll()">
        Показать все фотографии и видео
    </button>

</header>


<main id="results"></main>


<script>

const media = [

    {
        title: "shaxob",
        type: "image",
        file: "111.jpg",
        keywords: "shaxob"
    },

    {
        title: "Фотография 2",
        type: "image",
        file: "photo2.jpg",
        keywords: "photo2 фото фотография"
    },

    {
        title: "Видео 1",
        type: "video",
        file: "video (2).mp4",
        keywords: "video видео"
    },

    {
        title: "Видео 2",
        type: "video",
        file: "lv_0_20260918160833.mp4",
        keywords: "lv видео video"
    }

];


function showAll() {

    displayMedia(media);

}


function searchMedia() {

    const query = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    if (query === "") {
        showAll();
        return;
    }

    const results = media.filter(item => {

        return (
            item.title.toLowerCase().includes(query) ||
            item.keywords.toLowerCase().includes(query) ||
            item.file.toLowerCase().includes(query)
        );

    });

    displayMedia(results);

}


function displayMedia(items) {

    const results = document.getElementById("results");

    results.innerHTML = "";

    if (items.length === 0) {

        results.innerHTML = 
            <div class="not-found">
                <h2>Ничего не найдено</h2>
                <p>Попробуйте другое название.</p>
            </div>
        ;

        return;
    }


    items.forEach(item => {

        const div = document.createElement("div");

        div.className = "result";


        if (item.type === "image") {
            div.innerHTML = 
                <h2>${item.title}</h2>
                <p>Фотография</p>
                <img src="${item.file}" alt="${item.title}">
            ;

        }


        if (item.type === "video") {

            div.innerHTML = 
                <h2>${item.title}</h2>
                <p>Видео</p>
                <video controls>
                    <source src="${item.file}" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            ;

        }


        results.appendChild(div);

    });

}


document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchMedia();
        }

    });


showAll();

</script>

</body>
</html>
