<body>

    <header>

        <h1>ЭТО МОЙ ПЕРВЫЙ САЙТ</h1>

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Что хотите найти?"
            >

            <button onclick="search()">
                Поиск
            </button>

        </div>


        <button class="all-button" onclick="showAll()">
            Показать все фотографии и видео
        </button>

    </header>


    <div id="results"></div>


    <script>

        /*
        =====================================================
        БАЗА ДАННЫХ САЙТА
        =====================================================

        Здесь добавляются все фотографии и видео.

        Для фотографии используй:
        image: "название-файла.jpg"

        Для видео используй:
        video: "название-файла.mp4"

        Можно добавлять сколько угодно объектов.
        */


        const pages = [

            // ФОТОГРАФИЯ №1

            {
                title: "shaxob",
                text: "shaxob",
                image: "111.jpg"
            },


            // ВИДЕО №1

            {
                title: "Моё первое видео",
                text: "Видео с прогулки",
                video: "video (2).mp4"
            },


            // ВИДЕО №2

            {
                title: "видео",
                text: "Красивое видео",
                video: "lv_0_20260918160833.mp4"
            },


            // ЕЩЁ ОДНА ФОТОГРАФИЯ

            {
                title: "Фотография с путешествия",
                text: "Фото из поездки",
                image: "photo2.jpg"
            }

        ];


        /*
        =====================================================
        ФУНКЦИЯ ПОКАЗА РЕЗУЛЬТАТОВ
        =====================================================
        */


        function showResults(list) {

            const results = document.getElementById("results");


            results.innerHTML = list.map(page => `

                <div class="result">

                    <h2>${page.title}</h2>

                    <p>${page.text}</p>


                    ${
                        page.image
                        ?

                        `
                        <img
                            src="${page.image}"
                            alt="${page.title}"
                            onerror="this.style.display='none'"
                        >
                        `

                        :

                        ""
                    }


                    ${
                        page.video
                        ?

                        `
                        <video controls preload="metadata">

                            <source
                                src="${page.video}"
                                type="video/mp4"
                            >

                            Ваш браузер не поддерживает воспроизведение видео.

                        </video>
                        `

                        :

                        ""
                    }

                </div>

            `).join("");

        }


        /*
        =====================================================
        ПОКАЗАТЬ ВСЕ ФАЙЛЫ
        =====================================================
        */


        function showAll() {

            showResults(pages);

        }


        /*
        =====================================================
        ФУНКЦИЯ ПОИСКА
        =====================================================
        */


        function search() {

            const query = document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


            // Если пользователь ничего не ввёл

            if (query === "") {

                document.getElementById("results").innerHTML = "";

                return;

            }


            /*
            Ищем одновременно:
            - по названию;
            - по описанию.
            */


            const found = pages.filter(page =>

                page.title.toLowerCase().includes(query)

                ||

                page.text.toLowerCase().includes(query)

            );


            // Если ничего не найдено

            if (found.length === 0) {

                document.getElementById("results").innerHTML = `

                    <div class="not-found">

                        <h2>Ничего не найдено</h2>

                        <p>Попробуйте изменить поисковый запрос.</p>

                    </div>

                `;

                return;

            }


            // Показываем найденные результаты

            showResults(found);

        }


        /*
        =====================================================
        ПОИСК ПРИ НАЖАТИИ ENTER
        =====================================================
        */


        document
            .getElementById("searchInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    search();

                }

            });


    </script>

</body>

</html>
