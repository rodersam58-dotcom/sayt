<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>rodersam58 - мой сайт</title>

<meta name="description" content="официальный сайт rodersam58">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    color: #222;
}

header {
    background: #222;
    color: white;
    padding: 30px 15px;
}

h1 {
    margin: 0 0 20px;
    font-size: 30px;
}

.search {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    width: 60%;
    max-width: 500px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    padding: 14px 20px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    filter: brightness(1.15);
}

.all-button {
    margin-top: 15px;
    background: #444;
    color: white;
}

#results {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.result {
    background: white;
    margin: 20px 0;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.result h2 {
    margin-top: 0;
    font-size: 24px;
}

.result p {
    color: #555;
}

.result img,
.result video {
    max-width: 100%;
    width: 600px;
    border-radius: 10px;
    margin-top: 10px;
}

.result video {
    background: black;
}

.not-found {
    background: white;
    padding: 30px;
    border-radius: 10px;
}


/* =========================
   ИГРА
========================= */

.game-section {
    max-width: 920px;
    margin: 40px auto;
    padding: 20px;
}

.game-section h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.game-box {
    background: #111;
    padding: 15px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

#gameCanvas {
    display: block;
    width: 100%;
    max-width: 800px;
    height: auto;
    margin: auto;
    background: #202040;
    border-radius: 10px;
    touch-action: manipulation;
}

.game-info,
.game-message {
    color: white;
    margin-top: 10px;
    font-size: 18px;
}

.game-controls {
    margin-top: 15px;
}

.game-controls button {
    background: #444;
    color: white;
    margin: 5px;
}


/* =========================
   ГЛАВНОЕ МЕНЮ
========================= */

#menu,
#levels {
    color: white;
}

.menu-title {
    font-size: 36px;
    font-weight: bold;
    margin: 15px;
}

.menu-subtitle {
    color: #ccc;
    margin-bottom: 25px;
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(130px, 1fr)
    );
    gap: 12px;
    max-width: 650px;
    margin: 20px auto;
}

.level-btn {
    min-height: 90px;
    background: #333;
    color: white;
    border: 2px solid #666;
}

.level-btn:hover {
    border-color: white;
}

.level-btn strong {
    display: block;
    font-size: 22px;
}

.level-btn span {
    font-size: 13px;
    color: #bbb;
}

.back-btn {
    background: #555;
    color: white;
    margin-top: 10px;
}

.hidden {
    display: none !important;
}
