<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>rodersam58 - мой сайт</title>

<meta name="description" content="Официальный сайт rodersam58">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

/* ШАПКА */

header {
    background: #222;
    color: white;
    padding: 30px 15px;
    text-align: center;
}

h1 {
    margin: 0 0 20px;
    font-size: 30px;
}

/* ПОИСК */

.search {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

#searchInput {
    width: 60%;
    max-width: 500px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    padding: 14px 20px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    filter: brightness(1.15);
}

.search-button {
    background: #1877f2;
    color: white;
}

.all-button {
    margin-top: 15px;
    background: #444;
    color: white;
}

/* РЕЗУЛЬТАТЫ */

#results {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.result {
    background: white;
    margin: 20px 0;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.result h2 {
    margin-top: 0;
    font-size: 24px;
}

.result p {
    color: #555;
}

.result img,
.result video {
    display: block;
    max-width: 100%;
    width: 600px;
    margin: 10px auto 0;
    border-radius: 10px;
}

.result video {
    background: black;
}

/* ЕСЛИ НИЧЕГО НЕ НАЙДЕНО */

.not-found {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

/* ТЕЛЕФОН */

@media (max-width: 600px) {

    header {
        padding: 25px 10px;
    }

    h1 {
        font-size: 25px;
    }

    #searchInput {
        width: 100%;
    }

    .search-button {
        width: 100%;
    }

    .all-button {
        width: 100%;
    }

    .result {
        padding: 15px;
    }

    .result h2 {
        font-size: 21px;
    }

}

</style>

</head>


<body>

<header>

    <h1>rodersam58 - мой сайт</h1>

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Введите название фото или видео..."
        >

        <button
            class="search-button"
            onclick="searchMedia()"
        >
            Поиск
        </button>

    </div>

    <button
        class="all-button"
        onclick="showAll()"
    >
        Показать всё
    </button>

</header>


<main id="results"></main>


<script>

/* =========================
   ФОТО И ВИДЕО
========================= */

const media = [

    {
        title: "Фотография 1",
        type: "image",
        file: "111.jpg",
        keywords: "111 фото фотография"
    },

    {
        title: "Фотография 2",
        type: "image",
        file: "6022854_15.jpg",
        keywords: "6022854 фото фотография"
    },

    {
        title: "Видео 1",
        type: "video",
        file: "lv_0_20260918160833.mp4",
        keywords: "lv видео video"
    },

    {
        title: "Видео 2",
        type: "video",
        file: "video (2).mp4",
        keywords: "video видео"
    },

    {
        title: "Видео 3",
        type: "video",
        file: "video_2024-04-14_18-23-13.mp4",
        keywords: "video видео"
    }

];


/* =========================
   ПОКАЗАТЬ ВСЁ
========================= */

function showAll() {

    displayMedia(media);

}


/* =========================
   ПОИСК
========================= */

function searchMedia() {

    const input = document.getElementById("searchInput");

    const query = input.value
        .toLowerCase()
        .trim();

    /* Если поле пустое — показать всё */

    if (query === "") {

        showAll();

        return;
    }


    const found = media.filter(item => {
        return (
            item.title.toLowerCase().includes(query) ||
            item.file.toLowerCase().includes(query) ||
            item.keywords.toLowerCase().includes(query)
        );

    });


    displayMedia(found);

}


/* =========================
   ОТОБРАЖЕНИЕ
========================= */

function displayMedia(items) {

    const results = document.getElementById("results");

    results.innerHTML = "";


    /* Ничего не найдено */

    if (items.length === 0) {

        results.innerHTML = 
            <div class="not-found">

                <h2>Ничего не найдено</h2>

                <p>
                    Попробуйте другое название.
                </p>

            </div>
        ;

        return;
    }


    /* Вывод найденных файлов */

    items.forEach(item => {

        const result = document.createElement("div");

        result.className = "result";


        /* ФОТО */

        if (item.type === "image") {

            result.innerHTML = 

                <h2>${item.title}</h2>

                <p>Фотография</p>

                <img
                    src="${item.file}"
                    alt="${item.title}"
                >

            ;

        }


        /* ВИДЕО */

        if (item.type === "video") {

            result.innerHTML = 

                <h2>${item.title}</h2>

                <p>Видео</p>

                <video controls>

                    <source
                        src="${item.file}"
                        type="video/mp4"
                    >

                    Ваш браузер не поддерживает видео.

                </video>

            ;

        }


        results.appendChild(result);

    });

}


/* =========================
   ENTER = ПОИСК
========================= */

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            searchMedia();

        }

    });


/* =========================
   ПРИ ОТКРЫТИИ САЙТА
   ПОКАЗЫВАЕМ ВСЁ
========================= */

showAll();

</script>

</body>

</html>
